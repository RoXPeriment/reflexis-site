<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REFLEXIS: sign-in code</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; color: #1d1d1f; background: #fff; }
  code { display: block; padding: 12px; border: 1px solid #ccc; border-radius: 6px; word-break: break-all; background: #f5f5f7; }
  button { margin-top: 12px; padding: 8px 16px; font: inherit; cursor: pointer; }
  .muted { color: #666; }
</style>
</head>
<body>
<h1>Sign-in code</h1>
<p id="lead">Copy this code and paste it into the terminal where <b>publish.py login</b> is waiting.</p>
<code id="code">(no code in this address)</code>
<button id="copy" type="button">Copy</button>
<p class="muted">Nothing on this page is sent anywhere: the code stays in your browser until you paste it.</p>
<script>
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), err = q.get("error_description") || q.get("error");
  const box = document.getElementById("code");
  if (code) box.textContent = code;
  else if (err) { box.textContent = err; document.getElementById("lead").textContent = "The sign-in didn't finish:"; }
  document.getElementById("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(box.textContent); document.getElementById("copy").textContent = "Copied"; }
    catch (e) { getSelection().selectAllChildren(box); }
  };
</script>
</body>
</html>
